<!DOCTYPE html>
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; margin: 2cm; }
        h1, h2, h3 { text-align: center; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid black; padding: 5px; }

        ul { list-style-type: none; margin: 0; padding: 0; }
        li { margin: 6px 0; }

        .note-box { border: 1px solid black; padding: 10px; margin: 15px 0; }
        .note-box p.title { font-style: italic; font-weight: bold; margin: 0 0 8px 0; }
        .checkbox-img { width: 12px; height: 12px; vertical-align: middle; margin-right: 6px; }

        @page {
            @top-left { content: counter(page); font-family: 'Times New Roman', serif; font-size: 10pt; }
        }
    </style>
</head>
<body>

<!-- Page header: page number at top left, header text centered below -->
<div style="position: running(headerText); text-align: center;">
    <p style="margin-top: -20pt;">Annex 3</p>
    <p>to the Policy and Procedure on</p>
    <p>Conflict of Interest of the</p>
    <p>Autonomous Organization of</p>
    <p>Education Nazarbayev University</p>
</div>

<!-- Use the headerText element on every page -->
<div style="display: none;" th:insert="~{this :: headerText}"></div>

<h3>DECLARATION FORM</h3>
<h3>Initial Conflict of Interest Declaration</h3>

<table>
    <tr><th colspan="2">PERSONAL DETAILS</th></tr>
    <tr>
        <td>Full name:</td>
        <td th:text="|${declaration.user.firstname} ${declaration.user.lastname}|"></td>
    </tr>
    <tr>
        <td>Position/Status:</td>
        <td th:text="${declaration.user.position}"></td>
    </tr>
    <tr>
        <td>Department/Office/School:</td>
        <td th:text="${declaration.user.department}"></td>
    </tr>
</table>

<div th:each="question : ${declaration.questionsWithAnswers}">
    <div style="margin-bottom: 20px;">
        <p><b th:text="|${question.orderNumber}. ${question.description['en']}|"></b></p>

        <!-- NOTE block -->
        <div th:if="${question.note != null}">
            <div class="note-box">
                <p class="title">NOTE:</p>
                <div th:utext="${#strings.replace(question.note['en'], '\n', '<br/>')}"></div>
            </div>
        </div>

        <!-- YES_NO / AGREE -->
        <div th:if="${question.questionType == 'YES_NO' or question.questionType == 'AGREE'}">
            <div th:each="option : ${question.optionsWithAnswers}">
                <p>
                    <img th:src="${option.isAnswered} ? ${checkedBox} : ${uncheckedBox}"
                         alt="checkbox" class="checkbox-img"/>
                    <span th:text="${option.description['en']}"></span>
                </p>
                <p th:if="${option.answer != null}" th:text="|Answer: ${option.answer}|"></p>

                <div th:if="${option.additionalAnswers != null}">
                    <div th:each="group : ${option.additionalAnswers.answers}">
                        <span th:each="a, stat : ${group.answers}"
                              th:text="${a.answer + (stat.last ? '' : ', ')}"
                              style="display: inline;"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- OPEN_ENDED -->
        <div th:if="${question.questionType == 'OPEN_ENDED'}">
            <div th:each="option : ${question.optionsWithAnswers}">
                <p th:text="${option.answer}"></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
